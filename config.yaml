server:
  host: "127.0.0.1"
  port: 8080

privacy:
  enabled: true
  backends:
    - type: "regex"
    # Uncomment to enable NER (names, addresses, phone numbers, credit cards).
    # Requires: uv pip install "presidio-analyzer>=2.2.0" && python -m spacy download en_core_web_lg
    - type: "presidio"
      model: "en_core_web_lg"
  entities:
    # Structured PII — handled by regex
    - EMAIL_ADDRESS
    - IP_ADDRESS
    - CIDR
    - DOMAIN
    - API_KEY
    - SECRET
    - AWS_ARN
    # PORT intentionally omitted — port numbers identify services, not people or secrets
    # Unstructured NER — handled by presidio (uncomment when presidio backend is enabled)
    - PERSON
    - PHONE_NUMBER
    - CREDIT_CARD
    #- LOCATION
  whitelist:
    loopback:
      - "localhost"
      - "127.0.0.1"
      - "::1"
      - "0.0.0.0"
    ip_ranges: []
      # RFC 1918 private ranges are hardcoded safe — add extra ranges here if needed
    domains:
      # Internal
      - "settings.local"
      # LLM APIs
      - "api.anthropic.com"
      - "api.openai.com"
      # Source control
      - "github.com"
      - "gitlab.com"
      - "bitbucket.org"
      # Container registries
      - "docker.io"
      - "hub.docker.com"
      - "gcr.io"
      - "ghcr.io"
      # Google
      - "googleapis.com"
