server:
  host: "127.0.0.1"
  port: 8080

privacy:
  enabled: true
  backends:
    - type: "regex"         # context-bearing entities (email, IP, domain, CIDR, port)
    - type: "detect_secrets"  # secret-class entities — redacted one-way, not round-tripped
    # Uncomment to enable NER (names, phone numbers, credit cards).
    # Requires: uv pip install "presidio-analyzer>=2.2.0" && python -m spacy download en_core_web_lg
    # - type: "presidio"
    #   model: "en_core_web_lg"
  entities:
    # Context-bearing DevOps info — reversibly obfuscated (regex backend)
    - EMAIL_ADDRESS
    - IP_ADDRESS
    - CIDR
    - DOMAIN
    # PORT intentionally omitted — port numbers identify services, not secrets
    # Secret-class — redacted one-way (detect_secrets backend)
    - AWS_ARN
    - AWS_KEY
    - AZURE_KEY
    - BASIC_AUTH
    - DISCORD_TOKEN
    - GITHUB_TOKEN
    - GITLAB_TOKEN
    - JWT
    - MAILCHIMP_KEY
    - NPM_TOKEN
    - OPENAI_KEY
    - PRIVATE_KEY
    - PYPI_TOKEN
    - SECRET
    - SENDGRID_KEY
    - SLACK_TOKEN
    - SQUARE_TOKEN
    - STRIPE_KEY
    - TELEGRAM_TOKEN
    - TWILIO_KEY
    # Unstructured NER — reversibly obfuscated (presidio backend, if enabled)
    # - PERSON
    # - PHONE_NUMBER
    # - CREDIT_CARD
  whitelist:
    loopback:
      - "localhost"
      - "127.0.0.1"
      - "::1"
      - "0.0.0.0"
    ip_ranges: []
      # RFC 1918 private ranges are hardcoded safe — add extra ranges here if needed
    domains:
      # Internal
      - "settings.local"
      # LLM APIs
      - "api.anthropic.com"
      - "api.openai.com"
      # Source control
      - "github.com"
      - "gitlab.com"
      - "bitbucket.org"
      # Container registries
      - "docker.io"
      - "hub.docker.com"
      - "gcr.io"
      - "ghcr.io"
      # Google
      - "googleapis.com"
